        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/content/{contentId}/feature:
    post:
      operationId: adminFeatureContent
