    # ═══════════════════════════════════════════════════════════
    # ADMIN PANEL (E4.1) schemas
    # ═══════════════════════════════════════════════════════════

    AdminRole:
      type: string
      enum: [super_admin, content_moderator, support, finance, operations]

    AdminProfile:
      type: object
      required: [id, email, full_name, role, is_active, must_change_password, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/AdminRole" }
        is_active: { type: boolean }
        must_change_password: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    AdminChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 128 }
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must include lower + upper + digit + symbol, and differ from current.

    CreateAdminRequest:
      type: object
      required: [email, full_name, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        full_name: { type: string, minLength: 2, maxLength: 100 }
        role: { $ref: "#/components/schemas/AdminRole" }

    UpdateAdminRequest:
      type: object
      description: At least one of `role` / `is_active` must be provided.
      properties:
        role: { $ref: "#/components/schemas/AdminRole" }
        is_active: { type: boolean }

    CreateAdminResult:
      type: object
      required: [admin, temp_password]
      properties:
        admin: { $ref: "#/components/schemas/AdminProfile" }
        temp_password:
          type: string
          description: One-time plaintext. Shown once, never persisted, never returned again.

    TempPasswordResult:
      type: object
      required: [temp_password]
      properties:
        temp_password: { type: string }

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    FeatureToggleRequest:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    ForceReleasePayoutRequest:
      type: object
      required: [payout_id, reason]
      properties:
        payout_id: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }

    AdminRefundRequest:
      type: object
      required: [amount_paisa, reason, refund_type]
      properties:
        amount_paisa: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 20, maxLength: 500 }
        refund_type:
          type: string
          enum: [full, partial, goodwill]

    RefundResult:
      type: object
      required: [refund_id, status, amount_paisa]
      properties:
        refund_id: { type: string }
        status:
          type: string
          enum: [queued, processed, failed]
        amount_paisa: { type: integer }
        razorpay_refund_id: { type: string, nullable: true }

    AdminUserSummary:
      type: object
      required: [id, username, handle, phone, is_suspended, kyc_status, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        handle: { type: string }
        full_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string }
        is_suspended: { type: boolean }
        is_featured: { type: boolean }
        kyc_status:
          type: string
          enum: [none, pending, verified, rejected]
        created_at: { type: string, format: date-time }

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUserSummary"
        - type: object
          properties:
            is_creator: { type: boolean }
            bio: { type: string, nullable: true }
            avatar_url: { type: string, nullable: true }
            suspension_reason: { type: string, nullable: true }
            suspended_at: { type: string, format: date-time, nullable: true }
            content_counts:
              type: object
              properties:
                posts: { type: integer }
                itineraries: { type: integer }
                experiences: { type: integer }
                events: { type: integer }
            booking_counts:
              type: object
              properties:
                as_buyer: { type: integer }
                as_creator: { type: integer }

    AdminContentSummary:
      type: object
      required: [id, type, title, status, creator_id, created_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [post, itinerary, experience, event]
        title: { type: string }
        status:
          type: string
          enum: [draft, published, unpublished, removed]
        creator_id: { type: string, format: uuid }
        creator_username: { type: string, nullable: true }
        is_featured: { type: boolean }
        cover_image_url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    AdminContentDetail:
      allOf:
        - $ref: "#/components/schemas/AdminContentSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            price_paisa: { type: integer, nullable: true }
            report_count: { type: integer }
            takedown_reason: { type: string, nullable: true }
            takedown_at: { type: string, format: date-time, nullable: true }

    KycSubmissionSummary:
      type: object
      required: [user_id, full_name, submitted_at, status]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        submitted_at: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, verified, rejected]

    KycSubmission:
      allOf:
        - $ref: "#/components/schemas/KycSubmissionSummary"
        - type: object
          required: [pan_number_masked, aadhaar_last4, bank_ifsc, bank_account_last4]
          properties:
            pan_number_masked: { type: string }
            aadhaar_last4: { type: string }
            bank_name: { type: string }
            bank_ifsc: { type: string }
            bank_account_last4: { type: string }
            documents:
              type: object
              required: [pan_url, aadhaar_url, selfie_url, expires_at]
              properties:
                pan_url: { type: string, format: uri }
                aadhaar_url: { type: string, format: uri }
                selfie_url: { type: string, format: uri }
                expires_at: { type: string, format: date-time }

    AdminBookingDetail:
      type: object
      required: [id, status, amount_paisa, created_at]
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        buyer_username: { type: string }
        creator_id: { type: string, format: uuid }
        creator_username: { type: string }
        content_id: { type: string, format: uuid }
        content_title: { type: string }
        status:
          type: string
          enum: [pending, confirmed, attended, cancelled, refunded]
        amount_paisa: { type: integer }
        platform_fee_paisa: { type: integer }
        gst_paisa: { type: integer }
        creator_net_paisa: { type: integer }
        razorpay_payment_id: { type: string, nullable: true }
        payout_id: { type: string, format: uuid, nullable: true }
        refund_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    AdminPayoutSummary:
      type: object
      required: [id, status, amount_paisa, created_at]
      properties:
        id: { type: string, format: uuid }
        creator_id: { type: string, format: uuid }
        creator_username: { type: string, nullable: true }
        booking_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [scheduled, processing, completed, failed]
        amount_paisa: { type: integer }
        tds_paisa: { type: integer }
        release_at: { type: string, format: date-time, nullable: true }
        processed_at: { type: string, format: date-time, nullable: true }
        failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    AdminPayoutDetail:
      allOf:
        - $ref: "#/components/schemas/AdminPayoutSummary"
        - type: object
          properties:
            bank_name: { type: string, nullable: true }
            bank_ifsc: { type: string, nullable: true }
            bank_account_last4: { type: string, nullable: true }
            razorpay_payout_id: { type: string, nullable: true }
            razorpay_transfer_id: { type: string, nullable: true }
            booking:
              $ref: "#/components/schemas/AdminBookingDetail"
              nullable: true

    Collection:
      type: object
      required: [id, slug, title, priority, is_active, source, items, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        is_active: { type: boolean }
        source:
          type: string
          enum: [algorithmic, manual]
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminContentSummary"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCollectionRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title: { type: string, minLength: 3, maxLength: 100 }
        subtitle: { type: string, maxLength: 200 }
        cover_image_url: { type: string, format: uri }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 0 }
        source:
          type: string
          enum: [algorithmic, manual]
          default: manual
        content_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 200
          default: []

    UpdateCollectionRequest:
      type: object
      description: At least one field required.
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title: { type: string, minLength: 3, maxLength: 100 }
        subtitle: { type: string, maxLength: 200, nullable: true }
        cover_image_url: { type: string, format: uri, nullable: true }
        is_active: { type: boolean }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        content_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 200

    AppendCollectionItemRequest:
      type: object
      required: [content_id]
      properties:
        content_id: { type: string, format: uuid }

    QueryVolumeRow:
      type: object
      required: [query, count]
      properties:
        query: { type: string }
        count: { type: integer }

    CtrRow:
      type: object
      required: [query, searches, clicks, ctr]
      properties:
        query: { type: string }
        searches: { type: integer }
        clicks: { type: integer }
        ctr: { type: number, format: float }

    AuditEntry:
      type: object
      required: [id, admin_id, action, target_type, target_id, created_at]
      properties:
        id: { type: string, format: uuid }
        admin_id: { type: string, format: uuid }
        admin_email: { type: string, format: email, nullable: true }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
        ip_address: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    PaginationMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }

    DashboardSummary:
      type: object
      required:
        [
          users_24h,
          kyc_pending,
          reports_open,
          payouts_scheduled,
          refunds_pending,
          revenue_7d_paisa,
          recent_audit,
        ]
      properties:
        users_24h: { type: integer }
        kyc_pending: { type: integer }
        reports_open: { type: integer }
        payouts_scheduled: { type: integer }
        refunds_pending: { type: integer }
        revenue_7d_paisa: { type: integer }
        recent_audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"

