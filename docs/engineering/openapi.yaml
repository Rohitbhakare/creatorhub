openapi: 3.1.0
info:
  title: CreatorHub API
  version: 0.1.0
  description: |
    CreatorHub API — travel social platform + experience marketplace for India.
    All monetary amounts are in **paisa** (integer). All timestamps are ISO 8601 UTC.
    Auth: Firebase Phone OTP → JWT verified server-side.
  contact:
    name: CreatorHub Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.creatorhub.in
    description: Production

# ─── SECURITY ────────────────────────────────────────────────
security:
  - bearerAuth: []

# ─── TAGS ────────────────────────────────────────────────────
tags:
  - name: Health
    description: Liveness and readiness probes (no auth)
  - name: Auth
    description: Registration, session management, sign-out
  - name: Users
    description: User profile CRUD, username, phone change
  - name: Onboarding
    description: Location, verticals, suggested creators
  - name: Upload
    description: Signed upload URLs for media
  - name: Places
    description: Google Places API proxy (key never exposed to client)
  - name: Content
    description: Content CRUD, draft management, publish/unpublish state machine
  - name: Posts
    description: Post content type — text + images, no booking, no KYC
  - name: Itineraries
    description: Self-paced itineraries — spot-based day builder, map-first

# ─── PATHS ───────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the server process is running. No dependency checks.
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Checks DB connection and Firebase SDK initialization.
        Returns 200 if all checks pass, 503 if any check fails.
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  # ── Auth ────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Register or sign in with Firebase token
      description: |
        Called after Firebase Phone OTP or Social Login completes on the client.
        Verifies the Firebase ID token server-side, upserts the user record,
        and returns the user profile + app session.

        - New user: creates `users` row, returns 201
        - Existing user: updates `last_login_at`, returns 200

        SRS: IAM-FR-001, IAM-FR-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Existing user signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AuthResult"
        "201":
          description: New user created
          headers:
            Location:
              schema:
                type: string
              description: URI of created user resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Refresh app session
      description: |
        Exchanges a valid refresh token for a new access token.
        Mobile: 90-day rolling session. Web: 30-day session.
        SRS: IAM-FR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      summary: Sign out and revoke refresh token
      description: |
        Revokes the refresh token server-side. Client must clear local storage.
        SRS: IAM-FR-002
      responses:
        "204":
          description: Signed out successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ───────────────────────────────────────────────────
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user profile
      description: Returns the authenticated user's full profile.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update current user profile
      description: |
        Partial update of user profile fields.
        SRS: PROF-FR-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/me/username:
    put:
      operationId: changeUsername
      tags: [Users]
      summary: Change username (30-day cooldown)
      description: |
        Changes the user's username. Subject to 30-day cooldown.
        First-time set does not count as a change (cooldown remains null).
        SRS: PROF-FR-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  pattern: "^[a-z0-9_]{3,30}$"
                  description: Lowercase alphanumeric + underscore, 3-30 chars
      responses:
        "200":
          description: Username changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Within 30-day cooldown period
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/me/phone:
    put:
      operationId: changePhone
      tags: [Users]
      summary: Change phone number
      description: |
        Initiates phone number change. Requires OTP verification on new number.
        Rejects if new number already registered to another account.
        Logs old number in audit_events.
        SRS: PROF-FR-009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firebase_token]
              properties:
                firebase_token:
                  type: string
                  description: Firebase ID token from OTP verification on new number
      responses:
        "200":
          description: Phone number updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Phone number already registered to another account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/{userId}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get public user profile
      description: Returns a user's public profile. Guests allowed.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/follow:
    post:
      operationId: followUser
      tags: [Users]
      summary: Follow a user
      description: Creates a follow relationship. Idempotent.
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Followed (or already following)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FollowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: unfollowUser
      tags: [Users]
      summary: Unfollow a user
      description: Removes a follow relationship. Idempotent.
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: Unfollowed (or was not following)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Onboarding ──────────────────────────────────────────────
  /api/v1/onboarding/location:
    put:
      operationId: setOnboardingLocation
      tags: [Onboarding]
      summary: Set user's location during onboarding
      description: |
        Sets the user's current city (from ~4000 cities) and optional GPS coordinates.
        Cannot proceed through onboarding without this.
        SRS: ONB-FR-002, ONB-FR-010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLocationRequest"
      responses:
        "200":
          description: Location set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/verticals:
    put:
      operationId: setOnboardingVerticals
      tags: [Onboarding]
      summary: Set user's vertical interests (minimum 3)
      description: |
        Writes to `user_active_verticals`. Verticals with ≤10 published creators
        also written to `user_waitlisted_verticals`.
        SRS: ONB-FR-003, ONB-FR-008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verticals]
              properties:
                verticals:
                  type: array
                  items:
                    $ref: "#/components/schemas/Vertical"
                  minItems: 3
                  maxItems: 8
      responses:
        "200":
          description: Verticals set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-VerticalsResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/suggested-creators:
    get:
      operationId: getSuggestedCreators
      tags: [Onboarding]
      summary: Get suggested creators for onboarding
      description: |
        Returns creators personalized to user's selected verticals.
        Featured creators appear first.
        SRS: ONB-FR-004
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Suggested creators list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-SuggestedCreators"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [Onboarding]
      summary: Mark onboarding as complete
      description: |
        Sets `onboarding_completed_at` on user record.
        Should be called after location + verticals are set.
        SRS: ONB-FR-005
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Onboarding prerequisites not met (location or verticals missing)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Verticals & Cities ──────────────────────────────────────
  /api/v1/verticals:
    get:
      operationId: listVerticals
      tags: [Onboarding]
      summary: List all verticals with creator counts
      description: |
        Returns all 8 verticals with live creator counts.
        Verticals with 0 creators marked "coming soon".
        SRS: ONB-FR-007
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Verticals with counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-VerticalsList"

  /api/v1/cities:
    get:
      operationId: searchCities
      tags: [Onboarding]
      summary: Search cities (~4000 Indian cities)
      description: |
        Fuzzy search across ~4000 cities. Used in onboarding location picker.
        No tier filtering — all cities equally valid.
        SRS: ONB-FR-010
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (fuzzy matched against city name)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Matching cities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-CitiesList"

  /api/v1/cities/nearby:
    get:
      operationId: findNearbyCity
      tags: [Onboarding]
      summary: Find nearest city from GPS coordinates
      description: |
        Returns the nearest city to the given coordinates.
        Used for auto-detecting city from GPS during onboarding.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Nearest city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-City"
        "404":
          description: No city found within reasonable distance
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Upload ──────────────────────────────────────────────────
  /api/v1/uploads/signed-url:
    post:
      operationId: getSignedUploadUrl
      tags: [Upload]
      summary: Generate a signed upload URL
      description: |
        Returns a Firebase Storage signed URL for direct client upload.
        File type and size validated server-side before generating URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedUrlRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-SignedUrl"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Places Proxy ────────────────────────────────────────────
  /api/v1/places/autocomplete:
    get:
      operationId: placesAutocomplete
      tags: [Places]
      summary: Google Places autocomplete proxy
      description: |
        Proxies Google Places Autocomplete API. Key stays server-side.
        Biased to India (componentRestrictions: country:'in').
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search text for autocomplete
        - name: lat
          in: query
          schema:
            type: number
            format: double
          description: Latitude for location bias
        - name: lng
          in: query
          schema:
            type: number
            format: double
          description: Longitude for location bias
      responses:
        "200":
          description: Autocomplete predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PlacePredictions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/places/{placeId}:
    get:
      operationId: getPlaceDetails
      tags: [Places]
      summary: Google Places detail proxy
      description: |
        Proxies Google Places Details API. Returns name, coordinates,
        address, photos, rating. Key stays server-side.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PlaceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ── Content (shared) ────────────────────────────────────────
  /api/v1/content:
    post:
      operationId: createContentDraft
      tags: [Content]
      summary: Create a new content draft
      description: |
        Creates a draft content record of the specified type.
        User must be authenticated and have completed onboarding.
        Returns the draft with its ID for subsequent updates.
        SRS: CRT-FR-007, CRT-FR-008, CRT-FR-015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentDraftRequest"
      responses:
        "201":
          description: Draft created
          headers:
            Location:
              schema:
                type: string
              description: URI of created content resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Onboarding not completed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/content/{contentId}:
    get:
      operationId: getContentById
      tags: [Content]
      summary: Get content by ID
      description: |
        Returns full content details. Guests see published+public only.
        Owner sees their own content in any status.
        SRS: CRT-FR-008
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateContent
      tags: [Content]
      summary: Update a content draft
      description: |
        Partial update of content fields. Only owner can update.
        Only drafts can be edited (published content must be unpublished first).
        Supports optimistic concurrency via If-Match header with updated_at.
        SRS: CRT-FR-007
      parameters:
        - $ref: "#/components/parameters/contentId"
        - name: If-Match
          in: header
          schema:
            type: string
            format: date-time
          description: Expected updated_at value for optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Optimistic concurrency conflict (content was modified)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    delete:
      operationId: deleteContent
      tags: [Content]
      summary: Soft-delete content
      description: |
        Soft-deletes content (sets deleted_at). Only owner can delete.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "204":
          description: Content deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/content/{contentId}/publish:
    post:
      operationId: publishContent
      tags: [Content]
      summary: Publish content
      description: |
        Transitions content from draft to published (via under_review).
        Validates all required fields per content type.
        Checks KYC status for paid content.
        Requires T&Cs consent (sent in request body).
        SRS: CRT-FR-008, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Content published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner or KYC not verified for paid content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed — missing required fields
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  /api/v1/content/{contentId}/unpublish:
    post:
      operationId: unpublishContent
      tags: [Content]
      summary: Unpublish content
      description: |
        Transitions content from published to unpublished.
        Content becomes invisible to public but remains in creator's Studio.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in published status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/content/{contentId}/archive:
    post:
      operationId: archiveContent
      tags: [Content]
      summary: Archive content
      description: |
        Permanently archives content. Cannot be undone in MVP.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/content/me/drafts:
    get:
      operationId: listMyDrafts
      tags: [Content]
      summary: List current user's drafts
      description: |
        Returns the authenticated user's draft content, optionally filtered by type.
        Ordered by updated_at descending (most recently edited first).
        SRS: CRT-FR-007
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ContentType"
          description: Filter drafts by content type
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: User's drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Media ──────────────────────────────────────────────────
  /api/v1/media/confirm:
    post:
      operationId: confirmMediaUpload
      tags: [Upload]
      summary: Confirm a media upload and attach to content
      description: |
        Called by client after uploading file to Firebase Storage via signed URL.
        Server validates the file exists, creates a content_media record,
        and returns the media metadata.
        SRS: CRT-FR-012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMediaRequest"
      responses:
        "201":
          description: Media confirmed and attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-MediaItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Content not found or file not found in storage
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Media limit exceeded for content type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/media/{mediaId}:
    delete:
      operationId: deleteMedia
      tags: [Upload]
      summary: Remove media from content
      description: |
        Removes a media item from its content. Only content owner can delete.
        File remains in storage (cleanup via background job).
        SRS: CRT-FR-012
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Media removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Posts ───────────────────────────────────────────────────
  /api/v1/posts:
    post:
      operationId: createPostDraft
      tags: [Posts]
      summary: Create a post draft
      description: |
        Creates a new post draft. Sets type='post', pricing_model='free', price_paisa=0.
        No KYC required for posts.
        SRS: CRT-FR-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post draft created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      operationId: listPosts
      tags: [Posts]
      summary: List published posts
      description: |
        Returns published posts. Supports filtering by vertical, creator.
        Cursor-based pagination. Guests allowed.
        SRS: CRT-FR-001
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: vertical
          in: query
          schema:
            $ref: "#/components/schemas/Vertical"
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by creator
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentList"

  /api/v1/posts/{contentId}:
    get:
      operationId: getPostDetail
      tags: [Posts]
      summary: Get post detail
      description: |
        Returns full post detail with media, creator profile, engagement state.
        Guests see published only. Owner sees all statuses.
        SRS: CRT-FR-001, DD-026
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updatePost
      tags: [Posts]
      summary: Update a post draft
      description: |
        Updates post-specific fields. Only owner, only draft status.
        SRS: CRT-FR-001
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/posts/{contentId}/publish:
    post:
      operationId: publishPost
      tags: [Posts]
      summary: Publish a post
      description: |
        Validates post requirements (title, body, at least 1 image)
        and publishes. No KYC check needed for posts.
        SRS: CRT-FR-001, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Post published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed (missing title, body, or images)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  # ── Itineraries ────────────────────────────────────────────
  /api/v1/itineraries:
    post:
      operationId: createItineraryDraft
      tags: [Itineraries]
      summary: Create an itinerary draft
      description: |
        Creates a new self-paced itinerary draft with initial day skeletons.
        Requires day_count (1-30). Sets type='self_paced_itinerary'.
        SRS: CRT-FR-002, CRT-FR-019
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItineraryRequest"
      responses:
        "201":
          description: Itinerary draft created with day skeletons
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/itineraries/{contentId}:
    get:
      operationId: getItineraryDetail
      tags: [Itineraries]
      summary: Get itinerary detail with days and spots
      description: |
        Returns full itinerary with days, spots, and map data.
        For paid itineraries: non-buyers see Day 1 spots only (free preview).
        Guests allowed.
        SRS: CRT-FR-002, DD-023, DD-024
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Itinerary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateItinerary
      tags: [Itineraries]
      summary: Update itinerary draft fields
      description: |
        Updates itinerary-specific fields (day_count, starting_city, destinations, budget).
        Only owner, only draft status.
        SRS: CRT-FR-002
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItineraryRequest"
      responses:
        "200":
          description: Itinerary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/itineraries/{contentId}/publish:
    post:
      operationId: publishItinerary
      tags: [Itineraries]
      summary: Publish an itinerary
      description: |
        Validates itinerary requirements (title, days, spots, KYC for paid)
        and publishes. Auto-sets Day 1 spots as free preview for paid itineraries.
        SRS: CRT-FR-002, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Itinerary published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the owner or KYC not verified for paid itinerary
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed (missing days, spots, etc.)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  # ── Itinerary Days ─────────────────────────────────────────
  /api/v1/itineraries/{contentId}/days:
    post:
      operationId: addItineraryDay
      tags: [Itineraries]
      summary: Add a day to an itinerary
      description: |
        Adds a new day to the itinerary. Day number auto-assigned.
        Only owner, only draft status.
        SRS: CRT-FR-002
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayInput"
      responses:
        "201":
          description: Day added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Maximum 30 days or content is not a draft
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/itineraries/{contentId}/days/{dayId}:
    put:
      operationId: updateItineraryDay
      tags: [Itineraries]
      summary: Update a day's title and description
      description: Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayInput"
      responses:
        "200":
          description: Day updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: removeItineraryDay
      tags: [Itineraries]
      summary: Remove a day (cascades spots)
      description: |
        Removes a day and all its spots. Remaining days are renumbered.
        Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      responses:
        "204":
          description: Day removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Cannot remove the last day
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Itinerary Spots ────────────────────────────────────────
  /api/v1/itineraries/{contentId}/days/{dayId}/spots:
    post:
      operationId: addSpotToDay
      tags: [Itineraries]
      summary: Add a spot to a day
      description: |
        Adds a spot to the specified day. Fetches place details from Google (or cache).
        Auto-sets thumbnail from Google Places photo_reference.
        Spot order auto-assigned to end of list.
        SRS: CRT-FR-003, CRT-FR-016
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSpotRequest"
      responses:
        "201":
          description: Spot added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySpot"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Itinerary or day not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/itineraries/{contentId}/days/{dayId}/spots/{spotId}:
    put:
      operationId: updateSpot
      tags: [Itineraries]
      summary: Update a spot
      description: |
        Updates spot fields (creator_note, duration, stop_type).
        Only owner, only draft status.
        SRS: CRT-FR-003
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
        - $ref: "#/components/parameters/spotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpotRequest"
      responses:
        "200":
          description: Spot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySpot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: removeSpot
      tags: [Itineraries]
      summary: Remove a spot from a day
      description: |
        Removes a spot. Remaining spots are renumbered.
        Triggers distance recomputation for the day.
        Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
        - $ref: "#/components/parameters/spotId"
      responses:
        "204":
          description: Spot removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/itineraries/{contentId}/days/{dayId}/spots/reorder:
    put:
      operationId: reorderSpots
      tags: [Itineraries]
      summary: Reorder spots within a day
      description: |
        Accepts an ordered array of spot IDs and updates spot_order accordingly.
        All spot IDs must belong to the specified day.
        Triggers distance recomputation.
        SRS: CRT-FR-003
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spot_ids]
              properties:
                spot_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Spot IDs in desired order
      responses:
        "200":
          description: Spots reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "400":
          description: Missing or duplicate spot IDs
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

# ─── COMPONENTS ──────────────────────────────────────────────
components:

  # ── Security Schemes ────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token or app session token

  # ── Parameters ──────────────────────────────────────────────
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    contentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    dayId:
      name: dayId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    spotId:
      name: spotId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for pagination (base64-encoded)

    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50

  # ── Reusable Responses ──────────────────────────────────────
  responses:
    Unauthorized:
      description: Authentication required or token invalid/expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    ValidationError:
      description: Request validation failed (Zod errors)
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ProblemDetail"
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldError"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  # ── Schemas ─────────────────────────────────────────────────
  schemas:

    # ── Enums ─────────────────────────────────────────────────
    Vertical:
      type: string
      enum:
        - travel
        - stories
        - food
        - fitness
        - education
        - photography
        - music
        - wellness

    ContentType:
      type: string
      enum:
        - post
        - event
        - scheduled_experience
        - self_paced_itinerary

    ContentStatus:
      type: string
      enum:
        - draft
        - under_review
        - published
        - unpublished
        - archived
        - rejected
        - taken_down

    Visibility:
      type: string
      enum: [public, unlisted, private]

    PricingModel:
      type: string
      enum: [free, paid]

    KycStatus:
      type: string
      enum: [not_started, pending, verified, rejected, expired]

    # ── Common ────────────────────────────────────────────────
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [type, title, status, detail, instance]
          properties:
            type:
              type: string
              format: uri
              example: https://creatorhub.in/errors/validation-failed
            title:
              type: string
              example: Validation Failed
            status:
              type: integer
              example: 400
            detail:
              type: string
              example: Title must be between 3 and 200 characters.
            instance:
              type: string
              example: /api/v1/itineraries
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message, code]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: String must contain at least 3 character(s)
        code:
          type: string
          example: too_small

    CursorMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for next page (null if no more results)
        has_more:
          type: boolean
        per_page:
          type: integer

    # ── Auth ──────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [firebase_token]
      properties:
        firebase_token:
          type: string
          description: Firebase ID token from Phone OTP or Social Login
        device_info:
          type: object
          properties:
            platform:
              type: string
              enum: [ios, android, web]
            device_id:
              type: string
            app_version:
              type: string

    AuthResult:
      type: object
      required: [user, tokens, is_new_user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        tokens:
          $ref: "#/components/schemas/TokenPair"
        is_new_user:
          type: boolean
          description: True if this registration created a new user

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token expiry in seconds

    # ── User ──────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, phone, is_creator, kyc_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+919876543210"
        display_name:
          type: string
          nullable: true
          example: Riya Sharma
        username:
          type: string
          nullable: true
          example: riya_travels
        bio:
          type: string
          nullable: true
          maxLength: 280
        email:
          type: string
          format: email
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        is_creator:
          type: boolean
        kyc_status:
          $ref: "#/components/schemas/KycStatus"
        current_city:
          $ref: "#/components/schemas/City"
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        username_changed_at:
          type: string
          format: date-time
          nullable: true
        follower_count:
          type: integer
        following_count:
          type: integer
        content_count:
          type: integer
        created_at:
          type: string
          format: date-time

    PublicProfile:
      type: object
      required: [id, display_name, is_creator, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        is_creator:
          type: boolean
        current_city:
          $ref: "#/components/schemas/City"
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        featured:
          type: boolean
        follower_count:
          type: integer
        following_count:
          type: integer
        content_count:
          type: integer
        is_following:
          type: boolean
          description: Whether the authenticated user follows this user (null if guest)
          nullable: true
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 280
        email:
          type: string
          format: email
        avatar_url:
          type: string
          format: uri

    FollowResult:
      type: object
      required: [following, follower_count]
      properties:
        following:
          type: boolean
        follower_count:
          type: integer

    # ── Onboarding ────────────────────────────────────────────
    SetLocationRequest:
      type: object
      required: [city_id, source]
      properties:
        city_id:
          type: string
          description: City ID from cities table (e.g., "in.mh.pune")
        lat:
          type: number
          format: double
          description: GPS latitude (if source is "gps")
        lng:
          type: number
          format: double
          description: GPS longitude (if source is "gps")
        source:
          type: string
          enum: [gps, manual]

    VerticalsResult:
      type: object
      required: [active_verticals, waitlisted_verticals]
      properties:
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        waitlisted_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
          description: Verticals with ≤10 published creators (auto-detected)

    VerticalInfo:
      type: object
      required: [slug, name, creator_count, status]
      properties:
        slug:
          $ref: "#/components/schemas/Vertical"
        name:
          type: string
          example: Travel
        creator_count:
          type: integer
          description: Live count of published creators in this vertical
        status:
          type: string
          enum: [active, soon, coming_soon]
          description: "active (>10 creators), soon (1-10), coming_soon (0)"

    SuggestedCreator:
      type: object
      required: [id, display_name, is_featured]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        content_count:
          type: integer
        follower_count:
          type: integer
        is_featured:
          type: boolean
        is_following:
          type: boolean
          description: Whether current user already follows this creator

    # ── City ──────────────────────────────────────────────────
    City:
      type: object
      required: [id, name, state, country]
      properties:
        id:
          type: string
          example: in.mh.pune
        name:
          type: string
          example: Pune
        state:
          type: string
          example: Maharashtra
        country:
          type: string
          example: IN
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    # ── Upload ────────────────────────────────────────────────
    SignedUrlRequest:
      type: object
      required: [file_name, content_type, purpose]
      properties:
        file_name:
          type: string
          example: photo_01.jpg
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
            - application/pdf
          description: MIME type of the file to upload
        purpose:
          type: string
          enum: [avatar, content_image, content_video, kyc_document]
          description: Determines storage path and size limits
        content_id:
          type: string
          format: uuid
          description: Associated content ID (for content_image, content_video)

    SignedUrlResult:
      type: object
      required: [upload_url, file_path, expires_at]
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for direct upload
        file_path:
          type: string
          description: Storage path to reference after upload completes
        expires_at:
          type: string
          format: date-time
          description: URL expiry (15 minutes)

    # ── Places ────────────────────────────────────────────────
    PlacePrediction:
      type: object
      required: [place_id, description]
      properties:
        place_id:
          type: string
        description:
          type: string
          example: Tilicho Lake, Manang, Nepal
        structured_formatting:
          type: object
          properties:
            main_text:
              type: string
              example: Tilicho Lake
            secondary_text:
              type: string
              example: Manang, Nepal

    PlaceDetail:
      type: object
      required: [place_id, name, lat, lng]
      properties:
        place_id:
          type: string
        name:
          type: string
        formatted_address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: float
          nullable: true
        photos:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              width:
                type: integer
              height:
                type: integer

    # ── Content ────────────────────────────────────────────────
    CreateContentDraftRequest:
      type: object
      required: [type, vertical]
      properties:
        type:
          $ref: "#/components/schemas/ContentType"
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional at draft creation
        description:
          type: string
          maxLength: 280

    UpdateContentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        body:
          type: string
          maxLength: 1000
          description: Rich text body (posts only in MVP)
        sub_category_id:
          type: string
        leaf_type:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Price in paisa (max ₹10,000)
        starting_city_id:
          type: string
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        location_place_id:
          type: string
          description: Google Place ID for location tag
        vertical_data:
          type: object
          description: Vertical-specific data (schema varies by vertical)

    PublishContentRequest:
      type: object
      required: [tnc_version, tnc_accepted]
      properties:
        tnc_version:
          type: string
          description: T&Cs version string (e.g., "1.0.0")
        tnc_accepted:
          type: boolean
          const: true
          description: Must be true — T&Cs consent required

    ContentSummary:
      type: object
      required: [id, type, vertical, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ContentType"
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ContentStatus"
        visibility:
          $ref: "#/components/schemas/Visibility"
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
        cover_image_url:
          type: string
          format: uri
          nullable: true
          description: URL of the first media item (cover image)
        like_count:
          type: integer
        comment_count:
          type: integer
        view_count:
          type: integer
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContentDetail:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            body:
              type: string
              nullable: true
            sub_category_id:
              type: string
              nullable: true
            leaf_type:
              type: string
              nullable: true
            tags:
              type: array
              items:
                type: string
            facets:
              type: object
            vertical_data:
              type: object
            starting_city:
              $ref: "#/components/schemas/City"
            destination_city_ids:
              type: array
              items:
                type: string
            location_place_id:
              type: string
              nullable: true
            featured:
              type: boolean
            duration_minutes:
              type: integer
              nullable: true
            save_count:
              type: integer
            share_count:
              type: integer
            booking_count:
              type: integer
            media:
              type: array
              items:
                $ref: "#/components/schemas/MediaItem"
            creator:
              $ref: "#/components/schemas/PublicProfile"
            is_liked:
              type: boolean
              nullable: true
              description: Whether authenticated user liked this (null if guest)
            is_saved:
              type: boolean
              nullable: true
              description: Whether authenticated user saved this (null if guest)

    ContentListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
        meta:
          $ref: "#/components/schemas/CursorMeta"

    ValidationItem:
      type: object
      required: [field, label, passed]
      properties:
        field:
          type: string
          example: title
        label:
          type: string
          example: Title is required
        passed:
          type: boolean
        step:
          type: integer
          description: Wizard step number where this field lives

    # ── Media ─────────────────────────────────────────────────
    ConfirmMediaRequest:
      type: object
      required: [content_id, file_path, media_type, content_type]
      properties:
        content_id:
          type: string
          format: uuid
        file_path:
          type: string
          description: Storage path returned from signed-url endpoint
        media_type:
          type: string
          enum: [image, video, audio]
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        alt_text:
          type: string
          maxLength: 200
        display_order:
          type: integer
          minimum: 0
          description: Position in media list (auto-assigned if not provided)

    MediaItem:
      type: object
      required: [id, content_id, media_type, url, display_order]
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [image, video, audio]
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        alt_text:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        file_size_bytes:
          type: integer
          nullable: true
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Posts ──────────────────────────────────────────────────
    CreatePostRequest:
      type: object
      required: [vertical]
      properties:
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        body:
          type: string
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        location_place_id:
          type: string
          nullable: true
          description: Google Place ID for location tag (null to remove)
        sub_category_id:
          type: string
          nullable: true

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/ContentDetail"
        - type: object
          description: |
            Post-specific detail. Body text displayed in Fraunces 14px/1.65.
            No price field, no booking CTA. (DD-026, DD-027)

    # ── Itineraries ───────────────────────────────────────────
    CreateItineraryRequest:
      type: object
      required: [vertical, day_count]
      properties:
        vertical:
          type: string
          enum: [travel]
          description: Itineraries are travel-only in MVP
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        day_count:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days — creates empty day skeletons
        starting_city_id:
          type: string
          description: Starting city for the itinerary
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        sub_category_id:
          type: string
          description: Travel sub-category (e.g., "travel.road_trips")

    UpdateItineraryRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        day_count:
          type: integer
          minimum: 1
          maximum: 30
          description: Changing day count adds/removes day skeletons
        starting_city_id:
          type: string
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        sub_category_id:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
          minimum: 0
          maximum: 1000000
        budget_min_paisa:
          type: integer
          minimum: 0
          description: Minimum budget per person in paisa
        budget_max_paisa:
          type: integer
          minimum: 0
          description: Maximum budget per person in paisa
        vertical_data:
          type: object
          description: Category-adaptive fields (e.g., road_trip extras)

    ItineraryDayInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    ItineraryDay:
      type: object
      required: [id, content_id, day_number]
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        day_number:
          type: integer
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        total_distance_km:
          type: number
          format: float
          nullable: true
        estimated_hours:
          type: number
          format: float
          nullable: true
        spots:
          type: array
          items:
            $ref: "#/components/schemas/ItinerarySpot"
        spot_count:
          type: integer

    AddSpotRequest:
      type: object
      required: [google_place_id, name, lat, lng]
      properties:
        google_place_id:
          type: string
          description: Google Place ID (required in MVP)
        name:
          type: string
          maxLength: 200
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        creator_note:
          type: string
          maxLength: 500
        duration_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        stop_type:
          $ref: "#/components/schemas/SpotStopType"
        category:
          type: string
          description: Place category from Google Places

    UpdateSpotRequest:
      type: object
      properties:
        creator_note:
          type: string
          maxLength: 500
          nullable: true
        duration_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        stop_type:
          $ref: "#/components/schemas/SpotStopType"

    ItinerarySpot:
      type: object
      required: [id, itinerary_day_id, spot_order, name, lat, lng, stop_type]
      properties:
        id:
          type: string
          format: uuid
        itinerary_day_id:
          type: string
          format: uuid
        spot_order:
          type: integer
        google_place_id:
          type: string
          nullable: true
        name:
          type: string
        category:
          type: string
          nullable: true
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Google Places photo_reference URL (MVP only source)
        creator_note:
          type: string
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        stop_type:
          $ref: "#/components/schemas/SpotStopType"
        is_free_preview:
          type: boolean
          description: True for Day 1 spots of paid itineraries
        created_at:
          type: string
          format: date-time

    SpotStopType:
      type: string
      enum: [regular, overnight, meal, viewpoint, activity]

    ItinerarySummary:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            day_count:
              type: integer
            total_spots:
              type: integer
            total_distance_km:
              type: number
              format: float
              nullable: true
            starting_city:
              $ref: "#/components/schemas/City"

    ItineraryDetail:
      allOf:
        - $ref: "#/components/schemas/ContentDetail"
        - type: object
          required: [days]
          properties:
            day_count:
              type: integer
            total_spots:
              type: integer
            total_distance_km:
              type: number
              format: float
              nullable: true
            budget_min_paisa:
              type: integer
              nullable: true
            budget_max_paisa:
              type: integer
              nullable: true
            days:
              type: array
              items:
                $ref: "#/components/schemas/ItineraryDay"
              description: |
                All days with spots. For paid itineraries viewed by non-buyers,
                only Day 1 spots are included (others show spot_count only).
            has_purchased:
              type: boolean
              nullable: true
              description: Whether authenticated user has purchased (null if guest or free)

    # ── Readiness ─────────────────────────────────────────────
    ReadinessResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, degraded]
        checks:
          type: object
          properties:
            database:
              type: boolean
            firebase:
              type: boolean
        timestamp:
          type: string
          format: date-time

    # ── Generic Success Wrappers ──────────────────────────────
    # These use "-" separator to indicate the data type inside.
    # In code, the actual type replaces the wrapper.

    SuccessResponse-AuthResult:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/AuthResult"

    SuccessResponse-TokenPair:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/TokenPair"

    SuccessResponse-UserProfile:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/UserProfile"

    SuccessResponse-PublicProfile:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/PublicProfile"

    SuccessResponse-FollowResult:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/FollowResult"

    SuccessResponse-VerticalsResult:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/VerticalsResult"

    SuccessResponse-VerticalsList:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/VerticalInfo"

    SuccessResponse-SuggestedCreators:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/SuggestedCreator"

    SuccessResponse-CitiesList:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"

    SuccessResponse-City:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/City"

    SuccessResponse-SignedUrl:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/SignedUrlResult"

    SuccessResponse-PlacePredictions:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlacePrediction"

    SuccessResponse-PlaceDetail:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/PlaceDetail"

    SuccessResponse-ContentSummary:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ContentSummary"

    SuccessResponse-ContentDetail:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ContentDetail"

    SuccessResponse-ContentList:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ContentListResponse"

    SuccessResponse-PostDetail:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/PostDetail"

    SuccessResponse-MediaItem:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/MediaItem"

    SuccessResponse-ItinerarySummary:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ItinerarySummary"

    SuccessResponse-ItineraryDetail:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ItineraryDetail"

    SuccessResponse-ItineraryDay:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ItineraryDay"

    SuccessResponse-ItinerarySpot:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/ItinerarySpot"
