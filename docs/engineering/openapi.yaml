# ─── COMPONENTS ──────────────────────────────────────────────
components:

  # ── Security Schemes ────────────────────────────────────────
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token or app session token

    adminSession:
      type: apiKey
      in: cookie
      name: ch_admin_session
      description: |
        Signed JWT, 8 h rolling expiry, HttpOnly + Secure +
        SameSite=Strict. Issued by `/api/v1/admin/auth/login`; every
        gated request re-checks the row's `is_active` and `role`
        server-side.

  # ── Parameters ──────────────────────────────────────────────
  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    contentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    dayId:
      name: dayId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    spotId:
      name: spotId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor for pagination (base64-encoded)

    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50

    adminId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    collectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    analyticsWindow:
      name: window
      in: query
      schema:
        type: string
        enum: [7d, 30d]
        default: 7d

  # ── Reusable Responses ──────────────────────────────────────
  responses:
    Unauthorized:
      description: Authentication required or token invalid/expired
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    ValidationError:
      description: Request validation failed (Zod errors)
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ProblemDetail"
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: "#/components/schemas/FieldError"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

    AdminForbidden:
      description: |
        Admin session is valid but the row lacks the required role,
        `is_active=false`, or the action is blocked (e.g.
        `cannot_self_reset`, `last_super_admin`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  # ── Schemas ─────────────────────────────────────────────────
  schemas:

    # ── Enums ─────────────────────────────────────────────────
    Vertical:
      type: string
      enum:
        - travel
        - stories
        - food
        - fitness
        - education
        - photography
        - music
        - wellness

    ContentType:
      type: string
      enum:
        - post
        - event
        - scheduled_experience
        - self_paced_itinerary

    ContentStatus:
      type: string
      enum:
        - draft
        - under_review
        - published
        - unpublished
        - archived
        - rejected
        - taken_down

    Visibility:
      type: string
      enum: [public, unlisted, private]

    PricingModel:
      type: string
      enum: [free, paid]

    KycStatus:
      type: string
      enum: [not_started, pending, verified, rejected, expired]

    # ── Common ────────────────────────────────────────────────
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [type, title, status, detail, instance]
          properties:
            type:
              type: string
              format: uri
              example: https://creatorhub.in/errors/validation-failed
            title:
              type: string
              example: Validation Failed
            status:
              type: integer
              example: 400
            detail:
              type: string
              example: Title must be between 3 and 200 characters.
            instance:
              type: string
              example: /api/v1/itineraries
            errors:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, message, code]
      properties:
        field:
          type: string
          example: title
        message:
          type: string
          example: String must contain at least 3 character(s)
        code:
          type: string
          example: too_small

    CursorMeta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor for next page (null if no more results)
        has_more:
          type: boolean
        per_page:
          type: integer

    # ── Auth ──────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [firebase_token]
      properties:
        firebase_token:
          type: string
          description: Firebase ID token from Phone OTP or Social Login
        device_info:
          type: object
          properties:
            platform:
              type: string
              enum: [ios, android, web]
            device_id:
              type: string
            app_version:
              type: string

    AuthResult:
      type: object
      required: [user, tokens, is_new_user]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        tokens:
          $ref: "#/components/schemas/TokenPair"
        is_new_user:
          type: boolean
          description: True if this registration created a new user

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token expiry in seconds

    # ── User ──────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, phone, is_creator, kyc_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+919876543210"
        display_name:
          type: string
          nullable: true
          example: Riya Sharma
        username:
          type: string
          nullable: true
          example: riya_travels
        bio:
          type: string
          nullable: true
          maxLength: 280
        email:
          type: string
          format: email
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        is_creator:
          type: boolean
        kyc_status:
          $ref: "#/components/schemas/KycStatus"
        current_city:
          $ref: "#/components/schemas/City"
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        onboarding_completed_at:
          type: string
          format: date-time
          nullable: true
        username_changed_at:
          type: string
          format: date-time
          nullable: true
        follower_count:
          type: integer
        following_count:
          type: integer
        content_count:
          type: integer
        created_at:
          type: string
          format: date-time

    PublicProfile:
      type: object
      required: [id, display_name, is_creator, created_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        is_creator:
          type: boolean
        current_city:
          $ref: "#/components/schemas/City"
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        featured:
          type: boolean
        follower_count:
          type: integer
        following_count:
          type: integer
        content_count:
          type: integer
        is_following:
          type: boolean
          description: Whether the authenticated user follows this user (null if guest)
          nullable: true
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        bio:
          type: string
          maxLength: 280
        email:
          type: string
          format: email
        avatar_url:
          type: string
          format: uri

    FollowResult:
      type: object
      required: [following, follower_count]
      properties:
        following:
          type: boolean
        follower_count:
          type: integer

    # ── Onboarding ────────────────────────────────────────────
    SetLocationRequest:
      type: object
      required: [city_id, source]
      properties:
        city_id:
          type: string
          description: City ID from cities table (e.g., "in.mh.pune")
        lat:
          type: number
          format: double
          description: GPS latitude (if source is "gps")
        lng:
          type: number
          format: double
          description: GPS longitude (if source is "gps")
        source:
          type: string
          enum: [gps, manual]

    VerticalsResult:
      type: object
      required: [active_verticals, waitlisted_verticals]
      properties:
        active_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        waitlisted_verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
          description: Verticals with ≤10 published creators (auto-detected)

    VerticalInfo:
      type: object
      required: [slug, name, creator_count, status]
      properties:
        slug:
          $ref: "#/components/schemas/Vertical"
        name:
          type: string
          example: Travel
        creator_count:
          type: integer
          description: Live count of published creators in this vertical
        status:
          type: string
          enum: [active, soon, coming_soon]
          description: "active (>10 creators), soon (1-10), coming_soon (0)"

    SuggestedCreator:
      type: object
      required: [id, display_name, is_featured]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        bio:
          type: string
          nullable: true
        verticals:
          type: array
          items:
            $ref: "#/components/schemas/Vertical"
        content_count:
          type: integer
        follower_count:
          type: integer
        is_featured:
          type: boolean
        is_following:
          type: boolean
          description: Whether current user already follows this creator

    # ── City ──────────────────────────────────────────────────
    City:
      type: object
      required: [id, name, state, country]
      properties:
        id:
          type: string
          example: in.mh.pune
        name:
          type: string
          example: Pune
        state:
          type: string
          example: Maharashtra
        country:
          type: string
          example: IN
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double

    # ── Upload ────────────────────────────────────────────────
    SignedUrlRequest:
      type: object
      required: [file_name, content_type, purpose]
      properties:
        file_name:
          type: string
          example: photo_01.jpg
        content_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - video/mp4
            - application/pdf
          description: MIME type of the file to upload
        purpose:
          type: string
          enum: [avatar, content_image, content_video, kyc_document]
          description: Determines storage path and size limits
        content_id:
          type: string
          format: uuid
          description: Associated content ID (for content_image, content_video)

    SignedUrlResult:
      type: object
      required: [upload_url, file_path, expires_at]
      properties:
        upload_url:
          type: string
          format: uri
          description: Pre-signed URL for direct upload
        file_path:
          type: string
          description: Storage path to reference after upload completes
        expires_at:
          type: string
          format: date-time
          description: URL expiry (15 minutes)

    # ── Places ────────────────────────────────────────────────
    PlacePrediction:
      type: object
      required: [place_id, description]
      properties:
        place_id:
          type: string
        description:
          type: string
          example: Tilicho Lake, Manang, Nepal
        structured_formatting:
          type: object
          properties:
            main_text:
              type: string
              example: Tilicho Lake
            secondary_text:
              type: string
              example: Manang, Nepal

    PlaceDetail:
      type: object
      required: [place_id, name, lat, lng]
      properties:
        place_id:
          type: string
        name:
          type: string
        formatted_address:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        rating:
          type: number
          format: float
          nullable: true
        photos:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              width:
                type: integer
              height:
                type: integer

    # ── Content ────────────────────────────────────────────────
    CreateContentDraftRequest:
      type: object
      required: [type, vertical]
      properties:
        type:
          $ref: "#/components/schemas/ContentType"
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional at draft creation
        description:
          type: string
          maxLength: 280

    UpdateContentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        body:
          type: string
          maxLength: 1000
          description: Rich text body (posts only in MVP)
        sub_category_id:
          type: string
        leaf_type:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Price in paisa (max ₹10,000)
        starting_city_id:
          type: string
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        location_place_id:
          type: string
          description: Google Place ID for location tag
        vertical_data:
          type: object
          description: Vertical-specific data (schema varies by vertical)

    PublishContentRequest:
      type: object
      required: [tnc_version, tnc_accepted]
      properties:
        tnc_version:
          type: string
          description: T&Cs version string (e.g., "1.0.0")
        tnc_accepted:
          type: boolean
          const: true
          description: Must be true — T&Cs consent required

    ContentSummary:
      type: object
      required: [id, type, vertical, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ContentType"
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ContentStatus"
        visibility:
          $ref: "#/components/schemas/Visibility"
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
        cover_image_url:
          type: string
          format: uri
          nullable: true
          description: URL of the first media item (cover image)
        like_count:
          type: integer
        comment_count:
          type: integer
        view_count:
          type: integer
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContentDetail:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            body:
              type: string
              nullable: true
            sub_category_id:
              type: string
              nullable: true
            leaf_type:
              type: string
              nullable: true
            tags:
              type: array
              items:
                type: string
            facets:
              type: object
            vertical_data:
              type: object
            starting_city:
              $ref: "#/components/schemas/City"
            destination_city_ids:
              type: array
              items:
                type: string
            location_place_id:
              type: string
              nullable: true
            featured:
              type: boolean
            duration_minutes:
              type: integer
              nullable: true
            save_count:
              type: integer
            share_count:
              type: integer
            booking_count:
              type: integer
            media:
              type: array
              items:
                $ref: "#/components/schemas/MediaItem"
            creator:
              $ref: "#/components/schemas/PublicProfile"
            is_liked:
              type: boolean
              nullable: true
              description: Whether authenticated user liked this (null if guest)
            is_saved:
              type: boolean
              nullable: true
              description: Whether authenticated user saved this (null if guest)

    ContentListResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
        meta:
          $ref: "#/components/schemas/CursorMeta"

    # ── Feed ─────────────────────────────────────────────────
    FeedCreator:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true

    FeedContentItem:
      type: object
      required:
        - id
        - type
        - title
        - vertical
        - pricing_model
        - price_paisa
        - like_count
        - comment_count
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ContentType"
        title:
          type: string
        vertical:
          $ref: "#/components/schemas/Vertical"
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
        like_count:
          type: integer
        comment_count:
          type: integer
        duration_minutes:
          type: integer
          nullable: true
        starting_city_id:
          type: string
          nullable: true
        cover_image_url:
          type: string
          format: uri
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        creator:
          allOf:
            - $ref: "#/components/schemas/FeedCreator"
          nullable: true

    NearYouResult:
      type: object
      required: [items, fallback_level, label, fallback_cities]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedContentItem"
        fallback_level:
          type: integer
          description: 0=exact city · 1=200km · 2=500km · 3=India-wide
          minimum: 0
          maximum: 3
        label:
          type: string
          description: Human-readable section header
        fallback_cities:
          type: array
          description: Names of nearby cities pulled in (non-empty when fallback_level > 0)
          items:
            type: string

    DiscoverCreator:
      type: object
      required: [id, vertical]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        vertical:
          $ref: "#/components/schemas/Vertical"

    ValidationItem:
      type: object
      required: [field, label, passed]
      properties:
        field:
          type: string
          example: title
        label:
          type: string
          example: Title is required
        passed:
          type: boolean
        step:
          type: integer
          description: Wizard step number where this field lives

    # ── Media ─────────────────────────────────────────────────
    ConfirmMediaRequest:
      type: object
      required: [content_id, file_path, media_type, content_type]
      properties:
        content_id:
          type: string
          format: uuid
        file_path:
          type: string
          description: Storage path returned from signed-url endpoint
        media_type:
          type: string
          enum: [image, video, audio]
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        alt_text:
          type: string
          maxLength: 200
        display_order:
          type: integer
          minimum: 0
          description: Position in media list (auto-assigned if not provided)

    MediaItem:
      type: object
      required: [id, content_id, media_type, url, display_order]
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [image, video, audio]
        url:
          type: string
          format: uri
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        alt_text:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        file_size_bytes:
          type: integer
          nullable: true
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time

    # ── Posts ──────────────────────────────────────────────────
    CreatePostRequest:
      type: object
      required: [vertical]
      properties:
        vertical:
          $ref: "#/components/schemas/Vertical"
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        body:
          type: string
          maxLength: 1000
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        location_place_id:
          type: string
          nullable: true
          description: Google Place ID for location tag (null to remove)
        sub_category_id:
          type: string
          nullable: true

    PostDetail:
      allOf:
        - $ref: "#/components/schemas/ContentDetail"
        - type: object
          description: |
            Post-specific detail. Body text displayed in Fraunces 14px/1.65.
            No price field, no booking CTA. (DD-026, DD-027)

    # ── Itineraries ───────────────────────────────────────────
    CreateItineraryRequest:
      type: object
      required: [vertical, day_count]
      properties:
        vertical:
          type: string
          enum: [travel]
          description: Itineraries are travel-only in MVP
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        day_count:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days — creates empty day skeletons
        starting_city_id:
          type: string
          description: Starting city for the itinerary
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        sub_category_id:
          type: string
          description: Travel sub-category (e.g., "travel.road_trips")

    UpdateItineraryRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 280
        day_count:
          type: integer
          minimum: 1
          maximum: 30
          description: Changing day count adds/removes day skeletons
        starting_city_id:
          type: string
        destination_city_ids:
          type: array
          items:
            type: string
          maxItems: 10
        sub_category_id:
          type: string
        tags:
          type: array
          items:
            type: string
            maxLength: 30
          maxItems: 5
        pricing_model:
          $ref: "#/components/schemas/PricingModel"
        price_paisa:
          type: integer
          minimum: 0
          maximum: 1000000
        budget_min_paisa:
          type: integer
          minimum: 0
          description: Minimum budget per person in paisa
        budget_max_paisa:
          type: integer
          minimum: 0
          description: Maximum budget per person in paisa
        vertical_data:
          type: object
          description: Category-adaptive fields (e.g., road_trip extras)

    ItineraryDayInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500

    ItineraryDay:
      type: object
      required: [id, content_id, day_number]
      properties:
        id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        day_number:
          type: integer
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        total_distance_km:
          type: number
          format: float
          nullable: true
        estimated_hours:
          type: number
          format: float
          nullable: true
        spots:
          type: array
          items:
            $ref: "#/components/schemas/ItinerarySpot"
        spot_count:
          type: integer

    AddSpotRequest:
      type: object
      required: [google_place_id, name, lat, lng]
      properties:
        google_place_id:
          type: string
          description: Google Place ID (required in MVP)
        name:
          type: string
          maxLength: 200
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        creator_note:
          type: string
          maxLength: 500
        duration_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        stop_type:
          $ref: "#/components/schemas/SpotStopType"
        category:
          type: string
          description: Place category from Google Places

    UpdateSpotRequest:
      type: object
      properties:
        creator_note:
          type: string
          maxLength: 500
          nullable: true
        duration_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        stop_type:
          $ref: "#/components/schemas/SpotStopType"

    ItinerarySpot:
      type: object
      required: [id, itinerary_day_id, spot_order, name, lat, lng, stop_type]
      properties:
        id:
          type: string
          format: uuid
        itinerary_day_id:
          type: string
          format: uuid
        spot_order:
          type: integer
        google_place_id:
          type: string
          nullable: true
        name:
          type: string
        category:
          type: string
          nullable: true
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Google Places photo_reference URL (MVP only source)
        creator_note:
          type: string
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        stop_type:
          $ref: "#/components/schemas/SpotStopType"
        is_free_preview:
          type: boolean
          description: True for Day 1 spots of paid itineraries
        created_at:
          type: string
          format: date-time

    SpotStopType:
      type: string
      enum: [regular, overnight, meal, viewpoint, activity]

    ItinerarySummary:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            day_count:
              type: integer
            total_spots:
              type: integer
            total_distance_km:
              type: number
              format: float
              nullable: true
            starting_city:
              $ref: "#/components/schemas/City"

    ItineraryDetail:
      allOf:
        - $ref: "#/components/schemas/ContentDetail"
        - type: object
          required: [days]
          properties:
            day_count:
              type: integer
            total_spots:
              type: integer
            total_distance_km:
              type: number
              format: float
              nullable: true
            budget_min_paisa:
              type: integer
              nullable: true
            budget_max_paisa:
              type: integer
              nullable: true
            days:
              type: array
              items:
                $ref: "#/components/schemas/ItineraryDay"
              description: |
                All days with spots. For paid itineraries viewed by non-buyers,
                only Day 1 spots are included (others show spot_count only).
            has_purchased:
              type: boolean
              nullable: true
              description: Whether authenticated user has purchased (null if guest or free)

