openapi: 3.1.0
info:
  title: CreatorHub API
  version: 0.1.0
  description: |
    CreatorHub API — travel social platform + experience marketplace for India.
    All monetary amounts are in **paisa** (integer). All timestamps are ISO 8601 UTC.
    Auth: Firebase Phone OTP → JWT verified server-side.
  contact:
    name: CreatorHub Engineering
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.creatorhub.in
    description: Production

# ─── SECURITY ────────────────────────────────────────────────
security:
  - bearerAuth: []

# ─── TAGS ────────────────────────────────────────────────────
tags:
  - name: Health
    description: Liveness and readiness probes (no auth)
  - name: Auth
    description: Registration, session management, sign-out
  - name: Users
    description: User profile CRUD, username, phone change
  - name: Onboarding
    description: Location, verticals, suggested creators
  - name: Upload
    description: Signed upload URLs for media
  - name: Places
    description: Google Places API proxy (key never exposed to client)
  - name: Feed
    description: Home feed sections — For you, Following, Near you, hero, per-vertical rails, discover creators
  - name: Content
    description: Content CRUD, draft management, publish/unpublish state machine
  - name: Posts
    description: Post content type — text + images, no booking, no KYC
  - name: Itineraries
    description: Self-paced itineraries — spot-based day builder, map-first
  - name: Admin Auth
    description: Admin login, logout, me, forced password change (session cookie)
  - name: Admins
    description: Admin user CRUD (super_admin only) — provision, role change, deactivate, reset
  - name: Admin Users
    description: User search, suspend, unsuspend, feature toggle (operator view)
  - name: Admin Content
    description: Content moderation — search, takedown, feature toggle
  - name: Admin KYC
    description: KYC queue, detail, approve, reject (PII-gated)
  - name: Admin Bookings
    description: Booking detail and refund processing (finance roles)
  - name: Admin Payouts
    description: Payout list, detail, force-release (finance roles)
  - name: Admin Editorial
    description: Editorial collections — CRUD + item ordering
  - name: Admin Analytics
    description: Search analytics — top queries, zero-results, CTR
  - name: Admin Audit
    description: Immutable audit log read access (cursor-paginated)
  - name: Admin Dashboard
    description: Operator home — stat tiles + recent audit preview

# ─── PATHS ───────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────
  /healthz:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the server process is running. No dependency checks.
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  timestamp:
                    type: string
                    format: date-time

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Checks DB connection and Firebase SDK initialization.
        Returns 200 if all checks pass, 503 if any check fails.
      security: []
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  # ── Auth ────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: Register or sign in with Firebase token
      description: |
        Called after Firebase Phone OTP or Social Login completes on the client.
        Verifies the Firebase ID token server-side, upserts the user record,
        and returns the user profile + app session.

        - New user: creates `users` row, returns 201
        - Existing user: updates `last_login_at`, returns 200

        SRS: IAM-FR-001, IAM-FR-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Existing user signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AuthResult"
        "201":
          description: New user created
          headers:
            Location:
              schema:
                type: string
              description: URI of created user resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AuthResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      summary: Refresh app session
      description: |
        Exchanges a valid refresh token for a new access token.
        Mobile: 90-day rolling session. Web: 30-day session.
        SRS: IAM-FR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-TokenPair"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Auth]
      summary: Sign out and revoke refresh token
      description: |
        Revokes the refresh token server-side. Client must clear local storage.
        SRS: IAM-FR-002
      responses:
        "204":
          description: Signed out successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Users ───────────────────────────────────────────────────
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Get current user profile
      description: Returns the authenticated user's full profile.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update current user profile
      description: |
        Partial update of user profile fields.
        SRS: PROF-FR-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/me/username:
    put:
      operationId: changeUsername
      tags: [Users]
      summary: Change username (30-day cooldown)
      description: |
        Changes the user's username. Subject to 30-day cooldown.
        First-time set does not count as a change (cooldown remains null).
        SRS: PROF-FR-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  pattern: "^[a-z0-9_]{3,30}$"
                  description: Lowercase alphanumeric + underscore, 3-30 chars
      responses:
        "200":
          description: Username changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Username already taken
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Within 30-day cooldown period
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/me/phone:
    put:
      operationId: changePhone
      tags: [Users]
      summary: Change phone number
      description: |
        Initiates phone number change. Requires OTP verification on new number.
        Rejects if new number already registered to another account.
        Logs old number in audit_events.
        SRS: PROF-FR-009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firebase_token]
              properties:
                firebase_token:
                  type: string
                  description: Firebase ID token from OTP verification on new number
      responses:
        "200":
          description: Phone number updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Phone number already registered to another account
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/users/{userId}:
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get public user profile
      description: Returns a user's public profile. Guests allowed.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PublicProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/users/{userId}/follow:
    post:
      operationId: followUser
      tags: [Users]
      summary: Follow a user
      description: Creates a follow relationship. Idempotent.
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Followed (or already following)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FollowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: unfollowUser
      tags: [Users]
      summary: Unfollow a user
      description: Removes a follow relationship. Idempotent.
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "204":
          description: Unfollowed (or was not following)
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Onboarding ──────────────────────────────────────────────
  /api/v1/onboarding/location:
    put:
      operationId: setOnboardingLocation
      tags: [Onboarding]
      summary: Set user's location during onboarding
      description: |
        Sets the user's current city (from ~4000 cities) and optional GPS coordinates.
        Cannot proceed through onboarding without this.
        SRS: ONB-FR-002, ONB-FR-010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLocationRequest"
      responses:
        "200":
          description: Location set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/verticals:
    put:
      operationId: setOnboardingVerticals
      tags: [Onboarding]
      summary: Set user's vertical interests (minimum 3)
      description: |
        Writes to `user_active_verticals`. Verticals with ≤10 published creators
        also written to `user_waitlisted_verticals`.
        SRS: ONB-FR-003, ONB-FR-008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verticals]
              properties:
                verticals:
                  type: array
                  items:
                    $ref: "#/components/schemas/Vertical"
                  minItems: 3
                  maxItems: 8
      responses:
        "200":
          description: Verticals set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-VerticalsResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/suggested-creators:
    get:
      operationId: getSuggestedCreators
      tags: [Onboarding]
      summary: Get suggested creators for onboarding
      description: |
        Returns creators personalized to user's selected verticals.
        Featured creators appear first.
        SRS: ONB-FR-004
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Suggested creators list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-SuggestedCreators"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [Onboarding]
      summary: Mark onboarding as complete
      description: |
        Sets `onboarding_completed_at` on user record.
        Should be called after location + verticals are set.
        SRS: ONB-FR-005
      responses:
        "200":
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Onboarding prerequisites not met (location or verticals missing)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Verticals & Cities ──────────────────────────────────────
  /api/v1/verticals:
    get:
      operationId: listVerticals
      tags: [Onboarding]
      summary: List all verticals with creator counts
      description: |
        Returns all 8 verticals with live creator counts.
        Verticals with 0 creators marked "coming soon".
        SRS: ONB-FR-007
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Verticals with counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-VerticalsList"

  /api/v1/cities:
    get:
      operationId: searchCities
      tags: [Onboarding]
      summary: Search cities (~4000 Indian cities)
      description: |
        Fuzzy search across ~4000 cities. Used in onboarding location picker.
        No tier filtering — all cities equally valid.
        SRS: ONB-FR-010
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (fuzzy matched against city name)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Matching cities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-CitiesList"

  /api/v1/cities/nearby:
    get:
      operationId: findNearbyCity
      tags: [Onboarding]
      summary: Find nearest city from GPS coordinates
      description: |
        Returns the nearest city to the given coordinates.
        Used for auto-detecting city from GPS during onboarding.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: Nearest city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-City"
        "404":
          description: No city found within reasonable distance
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Upload ──────────────────────────────────────────────────
  /api/v1/uploads/signed-url:
    post:
      operationId: getSignedUploadUrl
      tags: [Upload]
      summary: Generate a signed upload URL
      description: |
        Returns a Firebase Storage signed URL for direct client upload.
        File type and size validated server-side before generating URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedUrlRequest"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-SignedUrl"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Places Proxy ────────────────────────────────────────────
  /api/v1/places/autocomplete:
    get:
      operationId: placesAutocomplete
      tags: [Places]
      summary: Google Places autocomplete proxy
      description: |
        Proxies Google Places Autocomplete API. Key stays server-side.
        Biased to India (componentRestrictions: country:'in').
      parameters:
        - name: input
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search text for autocomplete
        - name: lat
          in: query
          schema:
            type: number
            format: double
          description: Latitude for location bias
        - name: lng
          in: query
          schema:
            type: number
            format: double
          description: Longitude for location bias
      responses:
        "200":
          description: Autocomplete predictions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PlacePredictions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/places/{placeId}:
    get:
      operationId: getPlaceDetails
      tags: [Places]
      summary: Google Places detail proxy
      description: |
        Proxies Google Places Details API. Returns name, coordinates,
        address, photos, rating. Key stays server-side.
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PlaceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ── Feed ────────────────────────────────────────────────────
  /api/v1/feed/for-you:
    get:
      operationId: getForYouFeed
      tags: [Feed]
      summary: For-you feed — followed creators + user's verticals
      description: |
        Option-C ranking: followed creators weighted 2x (last 30d) merged
        with user's active verticals weighted 1x (last 60d). Tie-break on
        `like_count` capped at 500, then `published_at` desc. Falls back
        to popular-across-India (last 30d) when user has no follows and
        no verticals.
      responses:
        "200":
          description: Ranked feed items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/feed/following:
    get:
      operationId: getFollowingFeed
      tags: [Feed]
      summary: Following feed — strictly content from followed creators
      description: |
        Returns published content from creators the user follows, ordered
        newest-first. Empty array if the user follows no one — the client
        is responsible for showing an empty state.
      responses:
        "200":
          description: Following feed items (may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/feed/near-you:
    get:
      operationId: getNearYouFeed
      tags: [Feed]
      summary: Near-you feed — nearest-neighbor waterfall
      description: |
        Uses the user's stored `current_city_id` to run a distance waterfall
        (exact city → 200km → 500km → India-wide). Returns a human-readable
        label and, when the fallback radius kicks in, the list of nearby
        cities pulled in (DISC-FR-028 honesty banner).
      responses:
        "200":
          description: Near-you result with label and fallback metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-NearYouResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/feed/hero:
    get:
      operationId: getFeedHero
      tags: [Feed]
      summary: Single hero item for the active tab
      description: |
        Returns the top-ranking item for the given tab so mobile doesn't
        need to slice `items[0]`. Gives backend flexibility to swap in an
        editor-curated pick or a `featured` flag override in future without
        a mobile release.
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            type: string
            enum: [for_you, following, near_you]
            default: for_you
      responses:
        "200":
          description: Hero item (null when the underlying section is empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedHero"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/feed/vertical/{vertical}:
    get:
      operationId: getVerticalFeed
      tags: [Feed]
      summary: Per-vertical rail (optional auth)
      description: |
        Top 10 published items for the given vertical, ordered by
        `like_count` desc then `published_at` desc. Hidden on the client
        when empty.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: vertical
          in: path
          required: true
          schema:
            type: string
            enum: [travel, stories]
      responses:
        "200":
          description: Vertical rail items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/feed/discover:
    get:
      operationId: getDiscoverCreators
      tags: [Feed]
      summary: Discover creators from verticals outside the user's picks
      description: |
        Up to 10 creators whose vertical is not in the authenticated user's
        active verticals. For guests, returns any 10 creators.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Discover creators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-DiscoverCreators"

  # ── Feed v1.3 — travel-only home feed sections ──────────────
  /api/v1/feed/hot-near-you:
    get:
      operationId: getHotNearYou
      tags: [Feed]
      summary: Trending content within 100 km of the user (7-day window)
      description: |
        Returns up to 10 mixed-type items (posts/itineraries/experiences/events)
        ranked by `(views_7d + bookings_7d * 5)`. Used by the home rail and
        `/feed/section/hot-near-you`. SRS: FEED-FR-041.
      security: [{}, {bearerAuth: []}]
      parameters:
        - name: city_id
          in: query
          schema: {type: string}
        - name: lat
          in: query
          schema: {type: number, format: float}
        - name: lng
          in: query
          schema: {type: number, format: float}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        "200":
          description: Hot near you
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/trips-from-city:
    get:
      operationId: getTripsFromCity
      tags: [Feed]
      summary: Itineraries and experiences starting from a given city
      description: |
        Filters `content.starting_city_id = city_id`. SRS: FEED-FR-041.
      security: [{}, {bearerAuth: []}]
      parameters:
        - name: city_id
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        "200":
          description: Trips from city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/this-weekend:
    get:
      operationId: getThisWeekend
      tags: [Feed]
      summary: Events and experiences this weekend within 90 km
      description: |
        Returns rows with `event_occurrences.start_at` or `scheduled_dates.start_date`
        between upcoming Saturday 00:00 and Sunday 23:59, scoped to ≤ 90 km of user.
        SRS: FEED-FR-041.
      security: [{}, {bearerAuth: []}]
      parameters:
        - name: city_id
          in: query
          schema: {type: string}
        - name: lat
          in: query
          schema: {type: number, format: float}
        - name: lng
          in: query
          schema: {type: number, format: float}
        - name: limit
          in: query
          schema: {type: integer, default: 10}
      responses:
        "200":
          description: This weekend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/upcoming-events:
    get:
      operationId: getUpcomingEvents
      tags: [Feed]
      summary: Events in the next 30 days, ordered by start_at
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: city_id, in: query, schema: {type: string}}
        - {name: lat, in: query, schema: {type: number, format: float}}
        - {name: lng, in: query, schema: {type: number, format: float}}
        - {name: limit, in: query, schema: {type: integer, default: 10}}
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/day-trips:
    get:
      operationId: getDayTrips
      tags: [Feed]
      summary: Itineraries with duration ≤ 8 hours (return same day)
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: city_id, in: query, schema: {type: string}}
        - {name: lat, in: query, schema: {type: number, format: float}}
        - {name: lng, in: query, schema: {type: number, format: float}}
        - {name: limit, in: query, schema: {type: integer, default: 10}}
      responses:
        "200":
          description: Day trips
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/weekend-getaways:
    get:
      operationId: getWeekendGetaways
      tags: [Feed]
      summary: 2-day itineraries (one overnight)
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: city_id, in: query, schema: {type: string}}
        - {name: lat, in: query, schema: {type: number, format: float}}
        - {name: lng, in: query, schema: {type: number, format: float}}
        - {name: limit, in: query, schema: {type: integer, default: 10}}
      responses:
        "200":
          description: Weekend getaways
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-FeedItems"

  /api/v1/feed/posts:
    get:
      operationId: getPostsFeed
      tags: [Feed]
      summary: Cursor-paginated posts feed (Instagram-style)
      description: |
        Returns post-typed content only (`content.type='post'`), ordered by
        `published_at DESC`. `scope=near` filters to ST_DWithin(point, user_point, 100 km).
        `scope=following` requires auth and joins `creator_followers`.
        Optional `sub_category_id` AND filter. SRS: FEED-FR-042, FEED-FR-044.
      security: [{}, {bearerAuth: []}]
      parameters:
        - name: scope
          in: query
          required: true
          schema: {type: string, enum: [near, following]}
        - name: city_id
          in: query
          schema: {type: string}
        - name: sub_category_id
          in: query
          schema: {type: string}
        - name: cursor
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        "200":
          description: Posts feed page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/FeedContentItem"
                      next_cursor:
                        type: string
                        nullable: true

  # ── Discover v1.3 — refined-search results ──────────────────
  /api/v1/discover/results:
    get:
      operationId: getDiscoverResults
      tags: [Discover]
      summary: Paginated, multi-filter discovery results
      description: |
        Replaces the v1.2 `getCategoryBrowse` filter set with the 13-filter set
        from DISC-FR-041. All params optional; cursor-paginated.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: subCategoryId, in: query, schema: {type: string}}
        - {name: leafType, in: query, schema: {type: string}}
        - {name: contentType, in: query, schema: {type: string, enum: [post, itinerary, scheduled_experience, event]}}
        - {name: timeWindow, in: query, schema: {type: string, enum: [today, this_weekend, next_7d, this_month, custom]}}
        - {name: dateFrom, in: query, schema: {type: string, format: date}}
        - {name: dateTo, in: query, schema: {type: string, format: date}}
        - name: durationBuckets
          in: query
          schema:
            type: array
            items: {type: string, enum: [day_trip, weekend, short, long]}
          style: form
          explode: true
        - name: seasons
          in: query
          schema:
            type: array
            items: {type: string, enum: [monsoon, winter, summer, spring, autumn]}
          style: form
          explode: true
        - name: months
          in: query
          schema:
            type: array
            items: {type: integer, minimum: 1, maximum: 12}
          style: form
          explode: true
        - name: budgetBuckets
          in: query
          schema:
            type: array
            items: {type: string, enum: [free, lt2k, '2to5k', '5to15k', gt15k]}
          style: form
          explode: true
        - name: difficulties
          in: query
          schema:
            type: array
            items: {type: string, enum: [easy, moderate, hard, expert]}
          style: form
          explode: true
        - name: groupSizes
          in: query
          schema:
            type: array
            items: {type: string, enum: [solo, pair, small, large]}
          style: form
          explode: true
        - {name: destinationCityId, in: query, schema: {type: string}}
        - {name: destinationLat, in: query, schema: {type: number, format: float}}
        - {name: destinationLng, in: query, schema: {type: number, format: float}}
        - {name: startingCityId, in: query, schema: {type: string}}
        - {name: distanceKm, in: query, schema: {type: integer, enum: [25, 50, 100, 250]}}
        - {name: userLat, in: query, schema: {type: number, format: float}}
        - {name: userLng, in: query, schema: {type: number, format: float}}
        - {name: sort, in: query, schema: {type: string, enum: [recent, trending, price_asc, price_desc]}}
        - {name: q, in: query, schema: {type: string}, description: free-text search}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200":
          description: Discover results page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/FeedContentItem"
                      next_cursor: {type: string, nullable: true}
                      total_count: {type: integer, nullable: true}

  /api/v1/discover/destinations/resolve:
    post:
      operationId: resolveDestination
      tags: [Discover]
      summary: Resolve a Google Place ID into a destination with lat/lng
      description: |
        Calls Places Details API, upserts into `place_cache`, returns synthetic
        destination identifiers. Client uses lat/lng to filter via
        `destinationLat`/`destinationLng` 25 km radius. SRS: DISC-FR-042.
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [place_id]
              properties:
                place_id: {type: string}
      responses:
        "200":
          description: Destination resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    properties:
                      destination_id: {type: string}
                      name: {type: string}
                      lat: {type: number, format: float}
                      lng: {type: number, format: float}
                      formatted_address: {type: string}

  # ── Users v1.3 — travel sub-categories ──────────────────────
  /api/v1/users/me/travel-sub-categories:
    put:
      operationId: setTravelSubCategories
      tags: [Users]
      summary: Persist the user's selected travel sub-categories
      description: |
        Writes to `users.travel_sub_categories TEXT[]` (migration 025). Used
        by onboarding ONB-FR-008 (R) and Edit Profile. SRS: IAM-FR-040.
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [travel_sub_categories]
              properties:
                travel_sub_categories:
                  type: array
                  items: {type: string}
                  minItems: 0
                  description: Array of sub-category slugs (e.g. travel.road_trips)
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}

  # ── Content (shared) ────────────────────────────────────────
  /api/v1/content:
    post:
      operationId: createContentDraft
      tags: [Content]
      summary: Create a new content draft
      description: |
        Creates a draft content record of the specified type.
        User must be authenticated and have completed onboarding.
        Returns the draft with its ID for subsequent updates.
        SRS: CRT-FR-007, CRT-FR-008, CRT-FR-015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentDraftRequest"
      responses:
        "201":
          description: Draft created
          headers:
            Location:
              schema:
                type: string
              description: URI of created content resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Onboarding not completed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/content/{contentId}:
    get:
      operationId: getContentById
      tags: [Content]
      summary: Get content by ID
      description: |
        Returns full content details. Guests see published+public only.
        Owner sees their own content in any status.
        SRS: CRT-FR-008
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateContent
      tags: [Content]
      summary: Update a content draft
      description: |
        Partial update of content fields. Only owner can update.
        Only drafts can be edited (published content must be unpublished first).
        Supports optimistic concurrency via If-Match header with updated_at.
        SRS: CRT-FR-007
      parameters:
        - $ref: "#/components/parameters/contentId"
        - name: If-Match
          in: header
          schema:
            type: string
            format: date-time
          description: Expected updated_at value for optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Optimistic concurrency conflict (content was modified)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    delete:
      operationId: deleteContent
      tags: [Content]
      summary: Soft-delete content
      description: |
        Soft-deletes content (sets deleted_at). Only owner can delete.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "204":
          description: Content deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/content/{contentId}/publish:
    post:
      operationId: publishContent
      tags: [Content]
      summary: Publish content
      description: |
        Transitions content from draft to published (via under_review).
        Validates all required fields per content type.
        Checks KYC status for paid content.
        Requires T&Cs consent (sent in request body).
        SRS: CRT-FR-008, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Content published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner or KYC not verified for paid content
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed — missing required fields
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  /api/v1/content/{contentId}/unpublish:
    post:
      operationId: unpublishContent
      tags: [Content]
      summary: Unpublish content
      description: |
        Transitions content from published to unpublished.
        Content becomes invisible to public but remains in creator's Studio.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in published status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/content/{contentId}/archive:
    post:
      operationId: archiveContent
      tags: [Content]
      summary: Archive content
      description: |
        Permanently archives content. Cannot be undone in MVP.
        SRS: CRT-FR-008
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Content archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/content/me/drafts:
    get:
      operationId: listMyDrafts
      tags: [Content]
      summary: List current user's drafts
      description: |
        Returns the authenticated user's draft content, optionally filtered by type.
        Ordered by updated_at descending (most recently edited first).
        SRS: CRT-FR-007
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ContentType"
          description: Filter drafts by content type
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: User's drafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Media ──────────────────────────────────────────────────
  /api/v1/media/confirm:
    post:
      operationId: confirmMediaUpload
      tags: [Upload]
      summary: Confirm a media upload and attach to content
      description: |
        Called by client after uploading file to Firebase Storage via signed URL.
        Server validates the file exists, creates a content_media record,
        and returns the media metadata.
        SRS: CRT-FR-012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMediaRequest"
      responses:
        "201":
          description: Media confirmed and attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-MediaItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Content not found or file not found in storage
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Media limit exceeded for content type
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/media/{mediaId}:
    delete:
      operationId: deleteMedia
      tags: [Upload]
      summary: Remove media from content
      description: |
        Removes a media item from its content. Only content owner can delete.
        File remains in storage (cleanup via background job).
        SRS: CRT-FR-012
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Media removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Posts ───────────────────────────────────────────────────
  /api/v1/posts:
    post:
      operationId: createPostDraft
      tags: [Posts]
      summary: Create a post draft
      description: |
        Creates a new post draft. Sets type='post', pricing_model='free', price_paisa=0.
        No KYC required for posts.
        SRS: CRT-FR-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post draft created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      operationId: listPosts
      tags: [Posts]
      summary: List published posts
      description: |
        Returns published posts. Supports filtering by vertical, creator.
        Cursor-based pagination. Guests allowed.
        SRS: CRT-FR-001
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: vertical
          in: query
          schema:
            $ref: "#/components/schemas/Vertical"
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by creator
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Post list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentList"

  /api/v1/posts/{contentId}:
    get:
      operationId: getPostDetail
      tags: [Posts]
      summary: Get post detail
      description: |
        Returns full post detail with media, creator profile, engagement state.
        Guests see published only. Owner sees all statuses.
        SRS: CRT-FR-001, DD-026
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-PostDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updatePost
      tags: [Posts]
      summary: Update a post draft
      description: |
        Updates post-specific fields. Only owner, only draft status.
        SRS: CRT-FR-001
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/posts/{contentId}/publish:
    post:
      operationId: publishPost
      tags: [Posts]
      summary: Publish a post
      description: |
        Validates post requirements (title, body, at least 1 image)
        and publishes. No KYC check needed for posts.
        SRS: CRT-FR-001, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Post published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ContentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed (missing title, body, or images)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  # ── Itineraries ────────────────────────────────────────────
  /api/v1/itineraries:
    post:
      operationId: createItineraryDraft
      tags: [Itineraries]
      summary: Create an itinerary draft
      description: |
        Creates a new self-paced itinerary draft with initial day skeletons.
        Requires day_count (1-30). Sets type='self_paced_itinerary'.
        SRS: CRT-FR-002, CRT-FR-019
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItineraryRequest"
      responses:
        "201":
          description: Itinerary draft created with day skeletons
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/itineraries/{contentId}:
    get:
      operationId: getItineraryDetail
      tags: [Itineraries]
      summary: Get itinerary detail with days and spots
      description: |
        Returns full itinerary with days, spots, and map data.
        For paid itineraries: non-buyers see Day 1 spots only (free preview).
        Guests allowed.
        SRS: CRT-FR-002, DD-023, DD-024
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/contentId"
      responses:
        "200":
          description: Itinerary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateItinerary
      tags: [Itineraries]
      summary: Update itinerary draft fields
      description: |
        Updates itinerary-specific fields (day_count, starting_city, destinations, budget).
        Only owner, only draft status.
        SRS: CRT-FR-002
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateItineraryRequest"
      responses:
        "200":
          description: Itinerary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Content is not in draft status
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/itineraries/{contentId}/publish:
    post:
      operationId: publishItinerary
      tags: [Itineraries]
      summary: Publish an itinerary
      description: |
        Validates itinerary requirements (title, days, spots, KYC for paid)
        and publishes. Auto-sets Day 1 spots as free preview for paid itineraries.
        SRS: CRT-FR-002, CRT-FR-020, CRT-FR-021
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishContentRequest"
      responses:
        "200":
          description: Itinerary published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the owner or KYC not verified for paid itinerary
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Validation failed (missing days, spots, etc.)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProblemDetail"
                  - type: object
                    properties:
                      validation_items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ValidationItem"

  # ── Itinerary Days ─────────────────────────────────────────
  /api/v1/itineraries/{contentId}/days:
    post:
      operationId: addItineraryDay
      tags: [Itineraries]
      summary: Add a day to an itinerary
      description: |
        Adds a new day to the itinerary. Day number auto-assigned.
        Only owner, only draft status.
        SRS: CRT-FR-002
      parameters:
        - $ref: "#/components/parameters/contentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayInput"
      responses:
        "201":
          description: Day added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: Maximum 30 days or content is not a draft
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/itineraries/{contentId}/days/{dayId}:
    put:
      operationId: updateItineraryDay
      tags: [Itineraries]
      summary: Update a day's title and description
      description: Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayInput"
      responses:
        "200":
          description: Day updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: removeItineraryDay
      tags: [Itineraries]
      summary: Remove a day (cascades spots)
      description: |
        Removes a day and all its spots. Remaining days are renumbered.
        Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      responses:
        "204":
          description: Day removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Cannot remove the last day
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ── Itinerary Spots ────────────────────────────────────────
  /api/v1/itineraries/{contentId}/days/{dayId}/spots:
    post:
      operationId: addSpotToDay
      tags: [Itineraries]
      summary: Add a spot to a day
      description: |
        Adds a spot to the specified day. Fetches place details from Google (or cache).
        Auto-sets thumbnail from Google Places photo_reference.
        Spot order auto-assigned to end of list.
        SRS: CRT-FR-003, CRT-FR-016
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSpotRequest"
      responses:
        "201":
          description: Spot added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySpot"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Itinerary or day not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/itineraries/{contentId}/days/{dayId}/spots/{spotId}:
    put:
      operationId: updateSpot
      tags: [Itineraries]
      summary: Update a spot
      description: |
        Updates spot fields (creator_note, duration, stop_type).
        Only owner, only draft status.
        SRS: CRT-FR-003
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
        - $ref: "#/components/parameters/spotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpotRequest"
      responses:
        "200":
          description: Spot updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItinerarySpot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: removeSpot
      tags: [Itineraries]
      summary: Remove a spot from a day
      description: |
        Removes a spot. Remaining spots are renumbered.
        Triggers distance recomputation for the day.
        Only owner, only draft status.
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
        - $ref: "#/components/parameters/spotId"
      responses:
        "204":
          description: Spot removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/itineraries/{contentId}/days/{dayId}/spots/reorder:
    put:
      operationId: reorderSpots
      tags: [Itineraries]
      summary: Reorder spots within a day
      description: |
        Accepts an ordered array of spot IDs and updates spot_order accordingly.
        All spot IDs must belong to the specified day.
        Triggers distance recomputation.
        SRS: CRT-FR-003
      parameters:
        - $ref: "#/components/parameters/contentId"
        - $ref: "#/components/parameters/dayId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spot_ids]
              properties:
                spot_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Spot IDs in desired order
      responses:
        "200":
          description: Spots reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-ItineraryDay"
        "400":
          description: Missing or duplicate spot IDs
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not the content owner
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ─── Payouts (E2.12) ───────────────────────────────────────────
  /api/v1/creators/me/linked-account:
    get:
      tags: [Payouts]
      summary: Get my Razorpay linked account status
      description: |
        Returns the current KYC / Razorpay Route linked-account state for the
        authenticated creator. Used to drive the Studio → Earnings banner
        (activated / under_review / needs_clarification / rejected / suspended /
        missing).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Linked-account snapshot (may be null if never linked)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum: [created, under_review, activated, needs_clarification, rejected, suspended, deactivated]
                      activatedAt: { type: string, format: date-time, nullable: true }
                      holderName: { type: string, nullable: true }
                      bankAccountMasked: { type: string, nullable: true }
                      bankIfsc: { type: string, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/creators/me/payouts:
    get:
      tags: [Payouts]
      summary: List my payouts (paged)
      description: |
        Returns the authenticated creator's payouts, newest first. Includes a
        30-day rolling summary (pending / processing / paid) plus the page.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
          description: Base64-encoded cursor from the previous page.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Paged payouts + 30-day summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [summary, payouts]
                    properties:
                      summary:
                        type: object
                        required: [pendingPaisa, processingPaisa, paidLast30dPaisa]
                        properties:
                          pendingPaisa: { type: integer }
                          processingPaisa: { type: integer }
                          paidLast30dPaisa: { type: integer }
                      payouts:
                        type: array
                        items:
                          type: object
                          required: [id, status, amountPaisa, tdsPaisa, createdAt]
                          properties:
                            id: { type: string, format: uuid }
                            bookingId: { type: string, format: uuid, nullable: true }
                            bookingTitle: { type: string, nullable: true }
                            status:
                              type: string
                              enum: [scheduled, processing, completed, failed]
                            amountPaisa: { type: integer }
                            tdsPaisa: { type: integer }
                            failureReason: { type: string, nullable: true }
                            releaseAt: { type: string, format: date-time, nullable: true }
                            processedAt: { type: string, format: date-time, nullable: true }
                            createdAt: { type: string, format: date-time }
                      nextCursor: { type: string, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/webhooks/razorpay:
    post:
      tags: [Webhooks]
      summary: Razorpay webhook endpoint (HMAC-verified)
      description: |
        Razorpay posts lifecycle events here. Verified via
        `x-razorpay-signature` HMAC-SHA256 over the raw body using
        `RAZORPAY_WEBHOOK_SECRET`. Handled events:
        `payment.captured`, `transfer.settled`, `payout.processed`,
        `payout.reversed`, `payout.failed`, `account.activated`,
        `account.under_review`, `account.needs_clarification`,
        `account.rejected`, `account.suspended`.
        Unknown events 200-noop. Duplicate events (unique_violation on event id) 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, id, payload]
              properties:
                event: { type: string }
                id: { type: string }
                payload: { type: object, additionalProperties: true }
      parameters:
        - in: header
          name: x-razorpay-signature
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accepted (including duplicate / unknown events)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { type: object, additionalProperties: true }
        "403":
          description: Missing or invalid HMAC signature
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  # ═══════════════════════════════════════════════════════════════
  # ADMIN PANEL (E4.1) — session-cookie auth
  # ═══════════════════════════════════════════════════════════════
  # Every admin path below is gated by `adminSession` unless marked
  # `security: []`. The legacy `x-admin-secret` header is also
  # accepted on `/api/v1/admin/*` routes until T23 retires it; the
  # session cookie is the forward path. RFC 9457 problem details
  # on every error. See HLD § 11 and docs/epics/E4.1-admin-custom/
  # for context.

  # ── Admin Auth ──────────────────────────────────────────────
  /api/v1/admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin Auth]
      summary: Admin sign-in with email + password
      description: |
        Verifies credentials against `admin_users.password_hash`
        (bcrypt) and checks `is_active`. On success, issues a signed
        JWT in the `ch_admin_session` HttpOnly+Secure+SameSite=Strict
        cookie. Rate-limited to 10 req/min/IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Signed in; session cookie set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: ch_admin_session=<jwt>; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin Auth]
      summary: Clear the admin session cookie
      description: |
        Idempotent. Accepts missing or expired cookies and always
        returns 204. The response clears `ch_admin_session` via
        Set-Cookie with Max-Age=0.
      security: []
      responses:
        "204":
          description: Signed out (cookie cleared)
          headers:
            Set-Cookie:
              schema: { type: string }
              description: ch_admin_session=; Max-Age=0

  /api/v1/admin/auth/me:
    get:
      operationId: adminMe
      tags: [Admin Auth]
      summary: Current signed-in admin profile
      description: |
        Tolerates `must_change_password=true` so the UI can render
        `/change-password` before any other gated action. Rechecks
        `is_active` — inactive sessions get 403.
      security:
        - adminSession: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminProfile"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/auth/change-password:
    post:
      operationId: adminChangePassword
      tags: [Admin Auth]
      summary: Change password (self)
      description: |
        Required on first sign-in (`must_change_password=true`) and
        available to any admin at any time. New password must differ
        from current and satisfy the policy: ≥12 chars, upper +
        lower + digit + symbol. On success the session cookie is
        re-issued; other sessions are not invalidated.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordRequest"
      responses:
        "204":
          description: Password rotated; session re-issued
          headers:
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  # ── Admins (super_admin only) ───────────────────────────────
  /api/v1/admin/admins:
    get:
      operationId: listAdmins
      tags: [Admins]
      summary: List all admin users
      description: Includes inactive rows. Sorted by created_at desc.
      security:
        - adminSession: []
      responses:
        "200":
          description: Admin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
    post:
      operationId: createAdmin
      tags: [Admins]
      summary: Provision a new admin
      description: |
        Generates a one-time temporary password, bcrypts it, inserts
        the row with `must_change_password=true`, and returns the
        temp password in the response. The plaintext is shown **once**
        and never persisted — super_admin must out-of-band this to
        the new admin.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-CreateAdminResult"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "409":
          description: Email already belongs to another admin (active or inactive)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/admin/admins/{id}:
    patch:
      operationId: updateAdmin
      tags: [Admins]
      summary: Update admin role or is_active
      description: |
        At least one of `role` or `is_active` required. Demoting or
        deactivating the last remaining super_admin returns 409
        (`last_super_admin`, enforced by DB trigger).
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/adminId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminProfile"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Would demote / deactivate the last super_admin
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/admin/admins/{id}/reset-password:
    post:
      operationId: resetAdminPassword
      tags: [Admins]
      summary: Force-reset another admin's password
      description: |
        Generates a fresh one-time temp password, rotates the hash,
        and flips `must_change_password=true`. Super_admins cannot
        reset their own password via this endpoint (use
        `/auth/change-password` instead) — attempting returns 403
        (`cannot_self_reset`).
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/adminId"
      responses:
        "200":
          description: Temp password issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-TempPassword"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Admin Users (support / content_moderator / super_admin) ─
  /api/v1/admin/users/search:
    get:
      operationId: adminSearchUsers
      tags: [Admin Users]
      summary: Search users by phone, email, username, or handle
      description: |
        Partial match on `phone`, `email`, `username`, and `handle`.
        Returns minimal summaries; open a detail page for full PII.
      security:
        - adminSession: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: User matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminUserList"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }

  /api/v1/admin/users/{userId}:
    get:
      operationId: adminGetUserDetail
      tags: [Admin Users]
      summary: Full user detail incl. suspension + KYC state
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse-AdminUserDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/users/{userId}/suspend:
    post:
      operationId: adminSuspendUser
      tags: [Admin Users]
      summary: Suspend a user (reason required)
      description: |
        Flips `is_suspended=true`. Suspended users cannot publish,
        book, or comment. Writes `user.suspend` to the audit log.
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "204": { description: Suspended }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/users/{userId}/unsuspend:
    post:
      operationId: adminUnsuspendUser
      tags: [Admin Users]
      summary: Reverse a suspension (reason required)
      security:
        - adminSession: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
