# Fly.io configuration for CreatorHub API
# Deploy: fly deploy (from apps/api/)

app = "creatorhub-api"
primary_region = "bom"  # Mumbai — closest to Indian users

[build]
  dockerfile = "Dockerfile"
  # Build context is the monorepo root (run fly deploy from repo root)
  # fly deploy --config apps/api/fly.toml

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    port = 3000
    timeout = "5s"
    type = "http"

  [checks.ready]
    grace_period = "15s"
    interval = "60s"
    method = "GET"
    path = "/readyz"
    port = 3000
    timeout = "10s"
    type = "http"
